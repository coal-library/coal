[workspace]
name = "coal"
version = "3.0.2"
description = "An extension of the Flexible Collision Library"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
channels = ["conda-forge"]
license = "BSD-3-Clause"
license-file = "LICENSE"
preview = ["pixi-build"]

[dependencies]
ccache = ">=4.9.1"
cmake = ">=3.15"
cxx-compiler = ">=1.7.0"
ninja = ">=1.11"
pkg-config = ">=0.29.2"
git = ">=2.47.0"
nanobind = ">=2.5.0,<3"
libboost-devel = ">=1.80.0"
eigen = ">=3.4.0"
assimp = ">=5.4"
numpy = ">=1.22.0"
python = ">=3.9.0"
doxygen = ">=1.8"
lxml = ">=5.3"
pylatexenc = ">=2.10"
nanoeigenpy = ">=0.3.0"

[package]
name = { workspace = true }
version = { workspace = true }

[package.build]
backend = { name = "pixi-build-cmake", version = "0.3.*" }

[package.build.config]
extra-args = [
  "-DGENERATE_PYTHON_STUBS=ON",
  "-DBUILD_TESTING=OFF",
  "-DCOAL_HAS_QHULL=ON",
  "-DCOAL_BACKWARD_COMPATIBILITY_WITH_HPP_FCL=ON",
  "-DCOAL_PYTHON_NANOBIND=OFF",
]

[package.build.target.win-64.config]
extra-args = [
  "-DPYTHON_SITELIB=%PREFIX%/Lib/site-packages",
  "-DGENERATE_PYTHON_STUBS=ON",
  "-DBUILD_TESTING=OFF",
  "-DCOAL_HAS_QHULL=ON",
  "-DCOAL_BACKWARD_COMPATIBILITY_WITH_HPP_FCL=ON",
  "-DCOAL_PYTHON_NANOBIND=OFF",
]

[package.build-dependencies]
pkg-config = ">=0.29.2"
git = ">=2.47.0"
lxml = ">=5.3"
pylatexenc = ">=2.10"
doxygen = ">=1.8"

[package.host-dependencies]
libboost-devel = ">=1.80.0"
libboost-python-devel = ">=1.80.0"
eigen = ">=3.4.0"
assimp = ">=5.4"
numpy = ">=1.22.0"
python = ">=3.9.0"
eigenpy = ">=3.7.0"
octomap = ">=1.10"

[package.target.win.host-dependencies]
qhull = ">=2020.2"

[package.target.unix.host-dependencies]
qhull = ">=2020.2"
qhull-static = ">=2020.2"

[target.unix.activation]
scripts = ["development/scripts/pixi/activation.sh"]

[target.win-64.activation]
scripts = ["development/scripts/pixi/activation.bat"]

[activation.env]
# Setup ccache
CMAKE_CXX_COMPILER_LAUNCHER = "ccache"
# Create compile_commands.json for language server
CMAKE_EXPORT_COMPILE_COMMANDS = "ON"
# Activate color output with Ninja
CMAKE_COLOR_DIAGNOSTICS = "ON"
# Help ccache manage generated files and PCH (https://ccache.dev/manual/latest.html#_precompiled_headers)
CCACHE_SLOPPINESS = "include_file_ctime,include_file_mtime,pch_defines,time_macros"

[tasks]
# We must avoid to set CMAKE_CXX_FLAGS because of WIN32
# https://discourse.cmake.org/t/strictly-appending-to-cmake-lang-flags/6478
configure = { cmd = [
  "CXXFLAGS=$COAL_CXX_FLAGS",
  "cmake",
  "-G",
  "Ninja",
  "-B",
  "build",
  "-S",
  ".",
  # Don't use standard layout because it's not well implemented on Windows
  "-DPYTHON_STANDARD_LAYOUT=OFF",
  "-DPython_EXECUTABLE=$PYTHON_EXECUTABLE",
  "-DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX",
  "-DCMAKE_BUILD_TYPE=$COAL_BUILD_TYPE",
  "-DGENERATE_PYTHON_STUBS=$COAL_PYTHON_STUBS",
  "-DCOAL_HAS_QHULL=$COAL_HAS_QHULL",
  "-DCOAL_PYTHON_NANOBIND=$COAL_PYTHON_NANOBIND",
] }
build = { cmd = "cmake --build build --target all", depends-on = ["configure"] }
clean = { cmd = "rm -rf build" }
test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = [
  "build",
] }

[feature.lint]
dependencies = { pre-commit = ">=3.6.2" }
tasks = { lint = { cmd = "pre-commit run --all" } }

# Increment the version number with COAL_VERSION variable
[feature.new-version.dependencies]
tomlkit = ">=0.13.2"

[feature.new-version.tasks]
configure-new-version = { cmd = [
  "CXXFLAGS=$COAL_CXX_FLAGS",
  "cmake",
  "-G",
  "Ninja",
  "-B",
  "build_new_version",
  "-S",
  ".",
  # Don't use standard layout because it's not well implemented on Windows
  "-DPYTHON_STANDARD_LAYOUT=OFF",
  "-DPython_EXECUTABLE=$PYTHON_EXECUTABLE",
  "-DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX",
  "-DCMAKE_BUILD_TYPE=$COAL_BUILD_TYPE",
  "-DGENERATE_PYTHON_STUBS=ON",
  "-DCOAL_HAS_QHULL=ON",
  "-DCOAL_PYTHON_NANOBIND=$COAL_PYTHON_NANOBIND",
] }
release-new-version = { cmd = "VERSION=$COAL_VERSION cmake --build build_new_version --target release", depends-on = [
  "configure-new-version",
] }

# QHull support
[feature.qhull.target.win]
dependencies = { qhull = ">=2020.2" }
activation = { env = { COAL_HAS_QHULL = "ON" } }
[feature.qhull.target.unix]
dependencies = { qhull = ">=2020.2", qhull-static = ">=2020.2" }
activation = { env = { COAL_HAS_QHULL = "ON" } }

# Legacy Python bindings
[feature.boost-python]
dependencies = { libboost-python-devel = ">=1.80.0", eigenpy = ">=3.7.0" }
activation.env = { COAL_PYTHON_NANOBIND = "OFF" }

# Octomap support
[feature.octomap]
dependencies = { octomap = ">=1.10" }

[feature.python-latest.dependencies]
python = "3.14.*"

[feature.python-oldest.dependencies]
python = "3.10.*"
# nanobind need typing_extensions on Python <3.11
typing_extensions = ">=4.13.2"

# Use clang-cl on Windows
# If something go wrong, we can check this repository:
# https://github.com/conda-forge/clang-win-activation-feedstock/tree/main
[feature.clang-cl]
platforms = ["win-64"]
dependencies = { clangxx = "*", lld = "*" }

# Absolute path is needed to avoid using system clang-cl
[feature.clang-cl.activation.env]
CC = "%CONDA_PREFIX%\\Library\\bin\\clang-cl"
CXX = "%CONDA_PREFIX%\\Library\\bin\\clang-cl"

# Use clang on GNU/Linux
[feature.clang]
platforms = ["linux-64"]
activation = { env = { CC = "clang", CXX = "clang++" } }
dependencies = { clangxx = "*" }

[feature.test-pixi-build]
dependencies = { coal = { path = "." }, cmake = ">=3.22", python = "*" }

[feature.test-pixi-build.tasks]
test-cmake = "cmake -S test/pixi_build -B build_test_pixi_build"
test-python = "python -c 'import coal'"
test = { depends-on = ["test-cmake", "test-python"] }

[environments]
default = { features = ["python-latest"], solve-group = "python-latest" }
clang = { features = ["clang", "python-latest"] }
lint = { features = ["lint"], solve-group = "python-latest" }
qhull = { features = ["qhull", "python-latest"], solve-group = "python-latest" }
octomap = { features = [
  "octomap",
  "python-latest",
], solve-group = "python-latest" }
python-oldest = { features = ["python-oldest"], solve-group = "python-oldest" }
all = { features = [
  "qhull",
  "octomap",
  "python-latest",
], solve-group = "python-latest" }
# No solve-group, because boost.python will be legacy
all-boost-python = { features = [
  "qhull",
  "octomap",
  "python-latest",
  "boost-python",
] }
all-python-oldest = { features = [
  "qhull",
  "octomap",
  "python-oldest",
], solve-group = "python-oldest" }
all-clang-cl = { features = [
  "qhull",
  "octomap",
  "clang-cl",
  "python-latest",
], solve-group = "python-latest" }
# Release a new software version
new-version = { features = [
  "new-version",
  "qhull",
  "octomap",
  "python-latest",
], solve-group = "python-latest" }
test-pixi-build = { features = ["test-pixi-build"], no-default-feature = true }
